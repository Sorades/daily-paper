# Daily Paper 配置示例
#
# 默认配置文件位置：
#   Debug build:   ~/.config/daily-paper-dev/config.toml
#   Release build: ~/.config/daily-paper/config.toml
#
# 可通过 --directory/-d 覆盖数据目录

[zotero]
user_id = "123456"
api_key = "your-zotero-api-key"
max_snapshot_age_hours = 168

[[zotero.filters]]
path = "active-projects/**"
weight = 2.0

[[zotero.filters]]
path = "ignored/**"
exclude = true

[[sources]]
kind = "arxiv"
categories = ["cs.AI", "cs.CL", "cs.LG"]
include_cross_list = false
# max_results_per_page = 1000
# max_pages = 3

[embedding]
# kind: "openai-compatible" 或 "fastembed"
kind = "openai-compatible"
base_url = "https://api.openai.com/v1"
api_key = "your-openai-api-key"
model = "text-embedding-3-small"
batch_size = 64
timeout_secs = 60
max_retries = 5
max_concurrency = 4

# Fastembed 本地嵌入 (kind = "fastembed" 时使用以下默认值):
# model = "qwen3-embedding:0.6b"
# batch_size = 64

[reranker]
kind = "embedding_similarity"
top_k_library_matches = 20

[reader]
kind = "openai-compatible"
base_url = "https://api.openai.com/v1"
api_key = "your-openai-api-key"
model = "gpt-4o-mini"
top_n = 10
language = "zh-CN"
require_full_text = true
on_read_failure = "block"
timeout_secs = 120
max_retries = 5
max_concurrency = 2
max_input_tokens = 60000
# on_read_failure = "retry"  # 失败时重试，可选 "block"（跳过继续）

[pdf]
extractor = "pdftotext"
timeout_secs = 60
max_pdf_mb = 50
max_text_chars = 300000

[email]
smtp_server = "smtp.example.com"
smtp_port = 465
sender = "sender@example.com"
receiver = "receiver@example.com"
password = "your-smtp-password"

[web]
port = 8991
# ui_path = "ui"

[schedule]
enabled = true
time = "07:30"
